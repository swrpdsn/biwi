<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Happy Girlfriend Day, Biwi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Inter:wght@300;400;500&family=Pinyon+Script&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <!-- Ambient Background -->
    <div id="ambient-bg"></div>
    
    <!-- Desktop Cursor Hearts -->
    <div id="cursor-hearts"></div>

    <!-- Cinematic Fade Overlay -->
    <div id="fade-overlay"></div>

    <!-- Secret Easter Egg Overlay -->
    <div id="secret-overlay" class="hidden">
      <div class="secret-content">
        <p class="secret-text">P.S.<br><br>If I had to live this life again...<br>I'd still search for you.<br>I'd still fall for you.<br>I'd still choose you.<br><br>Every lifetime.<br><br><span class="secret-heart">❤️</span></p>
      </div>
    </div>

    <!-- Progress Hearts -->
    <div id="progress"></div>

    <!-- Music Toggle -->
    <button id="music-toggle" class="hidden" aria-label="Toggle music">
      <svg class="note-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 18V5l12-2v13"></path>
        <circle cx="6" cy="18" r="3"></circle>
        <circle cx="18" cy="16" r="3"></circle>
      </svg>
    </button>

    <!-- Slides Container -->
    <div id="slides"></div>

    <!-- Navigation Zones -->
    <button id="prev-zone" class="tap-zone left" aria-label="Previous"></button>
    <button id="next-zone" class="tap-zone right" aria-label="Next"></button>
    <button id="arrow-prev" class="arrow arrow-left">❮</button>
    <button id="arrow-next" class="arrow arrow-right">❯</button>

    <!-- Audio -->
    <audio id="bg-audio" loop preload="auto">
      <source src="assets/audio/song.mp3" type="audio/mpeg">
    </audio>
  </div>

  <script src="script.js"></script>
</body>
</html>
